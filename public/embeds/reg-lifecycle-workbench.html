const fs=$("#filters");fs.replaceChildren();for(const [k,label] of [["all",d.all],["A","A"],["B","B"],["C","C"],["shared",d.shared]]){const b=elem("button",null,label);b.type="button";b.dataset.key="filter-"+k;if(["A","B","C"].includes(k))b.setAttribute("aria-label",d.lanePrefix+k+" · "+d["lane"+k]);b.setAttribute("aria-pressed",String(filter===k));b.addEventListener("click",()=>{filter=k;render()});fs.append(b)}
const cs=$("#cycleList");cs.replaceChildren();const options=MODEL.cycles.filter(c=>filter==="all"||c.lane===filter||(filter==="shared"&&!c.lane));if(!options.some(c=>c.id===selected)&&options.length)selected=options[0].id;for(const c of options){const b=elem("button","cycle-btn");b.type="button";b.dataset.key="cycle-"+c.id;b.setAttribute("aria-pressed",String(c.id===selected));b.append(elem("code",null,c.id),elem("span",null,lang==="fr"?c.name_fr:c.name_en));b.addEventListener("click",()=>{selected=c.id;render()});cs.append(b)}
const c=MODEL.cycles.find(x=>x.id===selected);set("#cycleName",lang==="fr"?c.name_fr:c.name_en);set("#cycleId",c.id);set("#cycleDesc",(c.lane?d.laneWord+" "+c.lane:d.crossCutting)+" · "+(lang==="fr"?c.owner_role_fr:c.owner_role));
const ss=$("#states");ss.replaceChildren();for(let i=0;i<c.states.length;i++){const s=elem("span","state"+(i===0?" current":""),stateLabel(c.id,c.states[i]));if(lang==="fr")s.title=c.states[i];ss.append(s)}
const gs=$("#gateList");gs.replaceChildren();for(const gid of c.gates){const g=MODEL.gates.find(z=>z.id===gid);const div=elem("div","gate"), txt=elem("div");txt.append(elem("b",null,lang==="fr"?g.name_fr:g.name),elem("p",null,(lang==="fr"?g.purpose_fr:g.purpose)+" · "+d.gateReject+(lang==="fr"?g.reject_if_fr:g.reject_if)));div.append(txt,elem("span","gate-code",gid));gs.append(div)}
set("#maturity",(MATURITY[c.maturity]?MATURITY[c.maturity][lang]:c.maturity)+" · "+d.statusDetails);
for(const k of ["refuse","pending"])$("#"+k).setAttribute("aria-pressed",String(mode===k));const list=$("#eventList");list.replaceChildren();const evs=[["REQUESTED",d.req,""],["DECIDED",mode==="refuse"?d.decRef:d.decAccept,"decision"]];for(const [type,desc,css] of evs){const el=elem("div","event "+css);el.append(elem("div","evtype",type),elem("p",null,desc));list.append(el)}
set("#resultTitle",mode==="refuse"?d.resultRef:d.resultAccept);set("#resultDetail",mode==="refuse"?d.refDetail:d.acceptDetail);
if(focusKey){const again=document.querySelector(`[data-key="${focusKey}"]`);if(again&&again!==document.activeElement)again.focus();}
}
for(const k of ["fr","en"])$("#"+k).addEventListener("click",()=>{lang=k;render()});for(const k of ["refuse","pending"])$("#"+k).addEventListener("click",()=>{mode=k;render()});render();
</script>
</body></html>
