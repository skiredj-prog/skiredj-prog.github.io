<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENIR V5 - Vantage Point Synthesizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #050505; 
            color: #fff; 
            font-family: 'JetBrains Mono', monospace; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        #ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            pointer-events: none; 
            padding: 30px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel { 
            background: rgba(10, 10, 10, 0.85); 
            border: 1px solid #333; 
            padding: 20px; 
            pointer-events: auto; 
            backdrop-filter: blur(5px);
        }
        .title { 
            font-size: 16px; 
            color: #2dd4bf; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            font-weight: bold;
        }
        .subtitle {
            font-size: 10px; 
            color: #888; 
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .btn { 
            background: transparent; 
            border: 1px solid #5a5ee0; 
            color: #a0a3ff; 
            padding: 8px 12px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 11px; 
            transition: all 0.3s; 
            width: 100%;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .btn:hover { 
            background: rgba(90, 94, 224, 0.2); 
            box-shadow: 0 0 10px rgba(90, 94, 224, 0.5);
        }
        .btn-danger {
            border-color: #e05252; 
            color: #ffb3b3;
        }
        .btn-danger:hover {
            background: rgba(224, 82, 82, 0.2);
            box-shadow: 0 0 10px rgba(224, 82, 82, 0.5);
        }
        #delta-ticker { 
            align-self: flex-end;
            text-align: right; 
            min-width: 250px;
        }
        .stat { 
            font-size: 32px; 
            color: #2dd4bf; 
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
            transition: color 0.3s;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .color-box {
            width: 10px;
            height: 10px;
            margin-right: 10px;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="panel" style="width: 350px;">
            <div class="title">VANTAGE POINT SYNTHESIZER</div>
            <div class="subtitle">
                Combinatorial Entity States (CES) Topography<br>
                <span style="color: #5a5ee0;">[Phase 3: Visual Engine]</span>
            </div>
            
            <div style="margin-bottom: 20px;">
                <div class="legend-item"><div class="color-box" style="background: #ffd700; border-color: #ffd700;"></div> Real Entities (Anchors)</div>
                <div class="legend-item"><div class="color-box" style="background: #2dd4bf; border-color: #2dd4bf;"></div> Potential Entities (Variables)</div>
                <div class="legend-item"><div class="color-box" style="background: transparent; border-color: #5a5ee0;"></div> Admissibility Membrane</div>
            </div>

            <button class="btn" onclick="toggleDifferentiation()">TOGGLE DIFFERENTIATION (ZOOM)</button>
            <button class="btn btn-danger" onclick="injectChaos()">INJECT CHAOTIC SIGNAL</button>
        </div>
        
        <div id="delta-ticker" class="panel">
            <div style="font-size: 10px; color: #888; letter-spacing: 2px;">DELTA VIEW ROI</div>
            <div class="stat" id="roi-val">+0.00%</div>
            <div style="font-size: 10px; color: #5a5ee0;" id="gate-status">Admissibility Gate: ACTIVE</div>
            <div style="font-size: 9px; color: #666; margin-top: 10px;">Processing Renarration Stream...</div>
        </div>
    </div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // ==========================================
        // 1. SCENE SETUP (Isometric Projection)
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015);
        
        const aspect = window.innerWidth / window.innerHeight;
        const d = 25;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        
        // Isometric angle
        camera.position.set(30, 30, 30);
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // ==========================================
        // 2. ADMISSIBILITY MEMBRANE (Custom GLSL Shader)
        // ==========================================
        const membraneGeo = new THREE.PlaneGeometry(60, 60, 100, 100);
        const membraneMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0.0 },
                color1: { value: new THREE.Color(0x2dd4bf) }, // Cyan
                color2: { value: new THREE.Color(0x5a5ee0) }, // Purple
                color3: { value: new THREE.Color(0xe05252) }, // Red (for rejection)
                chaosFactor: { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                uniform float time;
                uniform float chaosFactor;
                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    // Pulsing wave effect based on time and chaos
                    float wave1 = sin(pos.x * 0.3 + time) * 2.0;
                    float wave2 = cos(pos.y * 0.3 + time * 0.8) * 2.0;
                    float chaosWave = sin(pos.x * 2.0 + time * 5.0) * chaosFactor * 3.0;
                    pos.z += wave1 + wave2 + chaosWave;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                uniform float time;
                uniform float chaosFactor;
                uniform vec3 color1;
                uniform vec3 color2;
                uniform vec3 color3;
                void main() {
                    // Mix colors based on position and time
                    float mixVal = (sin(vUv.x * 15.0 + time) + cos(vUv.y * 15.0 + time) + 2.0) / 4.0;
                    vec3 baseColor = mix(color1, color2, mixVal);
                    
                    // Inject red when chaos is high
                    vec3 finalColor = mix(baseColor, color3, chaosFactor);
                    
                    // Grid-like wireframe effect in shader
                    float grid = mod(vUv.x * 50.0, 1.0) < 0.05 || mod(vUv.y * 50.0, 1.0) < 0.05 ? 1.0 : 0.0;
                    
                    gl_FragColor = vec4(finalColor, 0.3 + grid * 0.5);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            wireframe: true
        });
        const membrane = new THREE.Mesh(membraneGeo, membraneMat);
        membrane.rotation.x = -Math.PI / 2;
        membrane.position.y = -8;
        scene.add(membrane);

        // ==========================================
        // 3. CES GRAPH NODES (Binary Entities - BETs)
        // ==========================================
        const nodesGroup = new THREE.Group();
        scene.add(nodesGroup);

        const nodeGeo = new THREE.IcosahedronGeometry(1.5, 0);
        const realMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true }); // Gold (Real/Constant)
        const potMat = new THREE.MeshBasicMaterial({ color: 0x2dd4bf, wireframe: true }); // Cyan (Potential/Variable)

        const nodes = [];
        // A, B, C, D positions
        const positions = [
            [0, 2, 0],     // Core (TAU)
            [6, 4, -6],    // Continuity
            [-6, -2, 6],   // R&D
            [8, 0, 8],     // Industrial
            [-8, 5, -8]    // External
        ];

        positions.forEach((pos, i) => {
            const isReal = i < 2; // First two are constant anchors
            const mesh = new THREE.Mesh(nodeGeo, isReal ? realMat : potMat);
            mesh.position.set(...pos);
            
            // Add inner solid core
            const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), isReal ? realMat : potMat);
            mesh.add(coreMesh);
            
            nodesGroup.add(mesh);
            nodes.push({ mesh, basePos: new THREE.Vector3(...pos), isReal });
        });

        // Draw Edges (Directed Acyclic Logic representation)
        const lineMat = new THREE.LineBasicMaterial({ color: 0x5a5ee0, transparent: true, opacity: 0.4 });
        for(let i=0; i<nodes.length; i++) {
            for(let j=i+1; j<nodes.length; j++) {
                // Only connect some to simulate a DAG
                if (Math.random() > 0.3) {
                    const points = [nodes[i].mesh.position, nodes[j].mesh.position];
                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(lineGeo, lineMat);
                    nodesGroup.add(line);
                }
            }
        }

        // ==========================================
        // 4. RENARRATION STREAM (Particle System)
        // ==========================================
        const particleCount = 1000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleVel = [];

        for(let i=0; i<particleCount; i++) {
            particlePos[i*3] = (Math.random() - 0.5) * 50;
            particlePos[i*3+1] = Math.random() * 30 + 10; // Start high above membrane
            particlePos[i*3+2] = (Math.random() - 0.5) * 50;
            particleVel.push({
                y: -Math.random() * 0.15 - 0.05, // Falling speed
                x: (Math.random() - 0.5) * 0.05,
                z: (Math.random() - 0.5) * 0.05
            });
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        
        // Create a circular texture for particles
        const canvas = document.createElement('canvas');
        canvas.width = 16; canvas.height = 16;
        const context = canvas.getContext('2d');
        context.beginPath();
        context.arc(8, 8, 8, 0, Math.PI * 2);
        context.fillStyle = '#ffffff';
        context.fill();
        const particleTexture = new THREE.CanvasTexture(canvas);

        const particleMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 0.4, 
            transparent: true, 
            opacity: 0.6,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // ==========================================
        // 5. ANIMATION & LOGIC LOOP
        // ==========================================
        const clock = new THREE.Clock();
        let roiValue = 0;
        let chaosLevel = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Update Membrane Shader
            membraneMat.uniforms.time.value = time;
            
            // Decay chaos
            if (chaosLevel > 0) {
                chaosLevel -= 0.01;
                membraneMat.uniforms.chaosFactor.value = chaosLevel;
            }

            // Rotate Nodes
            nodes.forEach((n, i) => {
                n.mesh.rotation.x += 0.01 * (i+1);
                n.mesh.rotation.y += 0.02;
            });

            // Update Particles (Renarration Stream)
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                positions[i*3] += particleVel[i].x;
                positions[i*3+1] += particleVel[i].y;
                positions[i*3+2] += particleVel[i].z;

                // Collision with Membrane (y = -8)
                if(positions[i*3+1] < -8) {
                    // Reset to top
                    positions[i*3+1] = 30;
                    positions[i*3] = (Math.random() - 0.5) * 50;
                    positions[i*3+2] = (Math.random() - 0.5) * 50;
                    
                    // Admissibility Logic Simulation
                    if(chaosLevel > 0.5 && Math.random() > 0.5) {
                        // Rejected by membrane during chaos
                    } else {
                        // Admitted - increase ROI
                        roiValue += 0.005;
                        document.getElementById('roi-val').innerText = '+' + roiValue.toFixed(2) + '%';
                    }
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 6. UI INTERACTIONS
        // ==========================================
        let differentiated = true;
        
        function toggleDifferentiation() {
            differentiated = !differentiated;
            
            // Animate nodes merging/separating
            let step = 0;
            const interval = setInterval(() => {
                step += 0.05;
                if(step >= 1) clearInterval(interval);
                
                nodes.forEach(n => {
                    if(!differentiated) {
                        // Un-differentiate: collapse into a single generalized sphere
                        n.mesh.position.lerp(new THREE.Vector3(0, 2, 0), 0.1);
                    } else {
                        // Differentiate: expand to granular atomic nodes
                        n.mesh.position.lerp(n.basePos, 0.1);
                    }
                });
                
                // Adjust camera zoom to match vantage point
                if(!differentiated) {
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, 0.6, 0.05);
                } else {
                    camera.zoom = THREE.MathUtils.lerp(camera.zoom, 1.0, 0.05);
                }
                camera.updateProjectionMatrix();
            }, 16);
        }

        function injectChaos() {
            chaosLevel = 1.0;
            membraneMat.uniforms.chaosFactor.value = chaosLevel;
            
            // Accelerate particles downwards
            for(let i=0; i<200; i++) {
                const idx = Math.floor(Math.random() * particleCount);
                particleVel[idx].y = -0.8; 
            }
            
            // UI Feedback
            const roiEl = document.getElementById('roi-val');
            const gateEl = document.getElementById('gate-status');
            
            roiEl.style.color = '#e05252';
            roiEl.style.textShadow = '0 0 15px rgba(224, 82, 82, 0.6)';
            gateEl.innerText = "Admissibility Gate: REJECTING INADMISSIBLE SIGNAL";
            gateEl.style.color = '#e05252';
            
            setTimeout(() => { 
                roiEl.style.color = '#2dd4bf'; 
                roiEl.style.textShadow = '0 0 15px rgba(45, 212, 191, 0.4)';
                gateEl.innerText = "Admissibility Gate: ACTIVE";
                gateEl.style.color = '#5a5ee0';
            }, 2000);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
