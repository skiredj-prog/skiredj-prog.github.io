name: Mobile navigation P0 regression
on:
  pull_request:
    paths:
      - 'src/layouts/Base.astro'
      - 'src/styles/site.css'
      - 'scripts/check-mobile-nav.mjs'
      - '.github/workflows/mobile-nav.yml'
  push:
    branches:
      - fix/p0-mobile-navigation-not-sticky
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - name: Test responsive menu in Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/tenir-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node scripts/check-mobile-nav.mjs
