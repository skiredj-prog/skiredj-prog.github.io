name: Action replay regression
on:
  pull_request:
    paths:
      - 'src/components/ActionReplay.astro'
      - 'src/components/ReplayReflection.astro'
      - 'src/components/CaptureLogDemo.astro'
      - 'src/components/PortfolioPage.astro'
      - 'src/pages/rejouer.astro'
      - 'src/pages/en/replay.astro'
      - 'src/pages/demonstrations/journal.astro'
      - 'src/pages/en/demos/log.astro'
      - 'src/data/site.ts'
      - 'src/data/actionReplay.ts'
      - 'src/data/replayReflections.ts'
      - 'src/styles/action-replay.css'
      - 'src/styles/capture-log-demo.css'
      - 'src/styles/experience.css'
      - 'src/styles/site.css'
      - 'src/scripts/site.ts'
      - 'src/layouts/Base.astro'
      - 'scripts/check-action-replay.mjs'
      - 'scripts/check-replay-reflections.mjs'
      - 'scripts/check-replay-accessibility.mjs'
      - 'scripts/check-capture-log-demo.mjs'
      - '.github/workflows/action-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - name: Verify the bilingual replay
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 4174 --bind 127.0.0.1 --directory dist >/tmp/tenir-replay.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node scripts/check-action-replay.mjs
          node scripts/check-replay-accessibility.mjs
          node scripts/check-replay-reflections.mjs
          node scripts/check-capture-log-demo.mjs
