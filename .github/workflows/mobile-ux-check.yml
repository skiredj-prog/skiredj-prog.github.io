name: UX mobile header regression
on:
  pull_request:
    paths:
      - 'src/styles/experience.css'
      - 'src/layouts/Base.astro'
      - 'src/components/Home.astro'
      - 'scripts/check-product-links.mjs'
      - 'scripts/check-ux-mobile-header.mjs'
      - '.github/workflows/mobile-ux-check.yml'
  push:
    branches:
      - codex/ux-journey-redesign
permissions:
  contents: read
jobs:
  responsive-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - run: node scripts/check-product-links.mjs
      - name: Chromium mobile regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/tenir-ux.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node scripts/check-ux-mobile-header.mjs
