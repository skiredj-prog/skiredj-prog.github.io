name: UX mobile header regression
on:
  pull_request:
    paths:
      - 'src/styles/experience.css'
      - 'src/components/Home.astro'
      - 'src/content/fr/diagnostic-execution.md'
      - 'src/content/en/diagnostic-execution.md'
      - 'scripts/check-commercial-browser.mjs'
      - 'src/components/WorkbenchPage.astro'
      - 'src/pages/portfolio/workbench.astro'
      - 'src/pages/en/portfolio/workbench.astro'
      - 'scripts/check-workbench-browser.mjs'
      - 'scripts/check-ux-mobile-header.mjs'
      - '.github/workflows/mobile-ux-check.yml'
  push:
    branches:
      - codex/ux-journey-redesign
permissions:
  contents: read
jobs:
  responsive-ux:
    # Match the OS supported by the pinned Playwright 1.56.1 browser bundle.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - name: Chromium mobile regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/tenir-ux.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node scripts/check-ux-mobile-header.mjs
          node scripts/check-commercial-browser.mjs
          node scripts/check-workbench-browser.mjs
