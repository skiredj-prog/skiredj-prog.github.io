name: E2E (live site) and S1 preview

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build this commit and run the S1 guard
        run: npm run build
      - name: Preview this commit
        run: |
          npm run preview -- --force > /tmp/tenir-preview.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4731/workbench/; then
              exit 0
            fi
            sleep 1
          done
          echo 'PR preview did not serve /workbench/'
          cat /tmp/tenir-preview.log
          exit 1
      - name: E2E live site, plus S1 routes on the PR preview
        run: npm run test:e2e
        env:
          WORKBENCH_PREVIEW_URL: http://127.0.0.1:4731
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
