name: Workbench staging — FR/EN pages, no private data

on:
  pull_request:
    paths:
      - 'src/components/WorkbenchPage.astro'
      - 'src/components/PortfolioPage.astro'
      - 'src/pages/portfolio/workbench.astro'
      - 'src/pages/en/portfolio/workbench.astro'
      - 'scripts/check-workbench-staging.mjs'
      - '.github/workflows/workbench-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - run: node scripts/check-workbench-staging.mjs
