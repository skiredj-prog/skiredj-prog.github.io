name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Checkout pinned REG Discovery catalogue
        uses: actions/checkout@v4
        with:
          repository: skiredj-prog/reg-conformance
          ref: 14acd5ab23706fae44c861df31c2b7417e4686eb
          path: _upstream/reg-conformance
          persist-credentials: false
      - name: Setup Python for Discovery projection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate REG Discovery projection
        working-directory: _upstream/reg-conformance
        run: |
          python -m pip install 'jsonschema>=4,<5' 'pytest>=8,<10'
          python -m pytest -q discovery/tests/
          python -m discovery.build_projection --output ../../public/discovery/projection-v0.1.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Check REG Discovery preview
        run: node scripts/check-discovery.mjs --dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
