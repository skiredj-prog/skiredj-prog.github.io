name: Site release readiness — critical routes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - name: Check retired contact address
        run: node scripts/check-contact-address.mjs
      - name: Verify critical routes, metadata, sitemap and domain
        run: node scripts/check-release-readiness.mjs
